input {
  beats {
    port => 5044
  }
}

filter {
  json {
    source => "message"
  }
}

output {
  elasticsearch {
    hosts => ["https://localhost:9200"]
    index => "%{[kubernetes][namespace]}-%{[kubernetes][deployment][name]}"
    user => "{{ lookup('community.hashi_vault.hashi_vault', 'secret=roboshop-infra/data/elk:username token={{ vault_token }} url=http://vault-internal.sdevops.shop:8200') }}"
    password => "{{ lookup('community.hashi_vault.hashi_vault', 'secret=roboshop-infra/data/elk:password token={{ vault_token }} url=http://vault-internal.sdevops.shop:8200') }}"
    ssl => true
    ssl_verification_mode => "none"
  }
}