- name: Set Prompt
  ansible.builtin.shell: set-prompt {{ role }}

- name : Grow disk size for var folder
  ansible.builtin.shell: |
    growpart /dev/nvme0n1 4
    lvextend -L +10G /dev/mapper/RootVG-varVol
    xfs_growfs /var
    df -h /var
  ignore_errors : yes

- name: Copy Elastic repo file
  ansible.builtin.template:
    src: elastic.repo
    dest: /etc/yum.repos.d/elastic.repo

- name: Install ELK
  ansible.builtin.dnf:
    name:
      - elasticsearch
      - kibana
      - logstash
      - nginx
    state: installed

- name: Copy nginx config file
  ansible.builtin.template:
    src: nginx.conf
    dest: /etc/nginx/nginx.conf

- name: Start ELK
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
    enabled: yes
  loop:
    - elasticsearch
    - kibana
    - logstash
    - nginx

- name : Copy logstash conf file
  ansible.builtin.template:
    src: beats.conf
    dest : /etc/logstash/conf.d/beats.conf

- name : Restart logstash
  ansible.builtin.systemd_service:
    name : logstash
    state : restarted